name: Monitor de noticias IA
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python coletar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dados/noticias.csv
          git commit -m "atualiza noticias $(date -u +%Y-%m-%d-%H%M)" || echo "nada novo"
          git push
